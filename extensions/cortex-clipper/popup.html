<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>80M Cortex</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1411;
        --panel: rgba(18, 25, 21, 0.72);
        --panel-2: rgba(28, 39, 33, 0.82);
        --line: rgba(138, 255, 177, 0.18);
        --line-strong: rgba(138, 255, 177, 0.36);
        --text: #f2fff5;
        --muted: #aebbb3;
        --green: #72ffa6;
        --amber: #ffd978;
        --red: #ff8f9d;
        --ink: #0d130f;
        --sidebar-hover: rgba(74, 222, 128, 0.08);
        --sidebar-active: rgba(74, 222, 128, 0.14);
        --sidebar-border: rgba(114, 255, 166, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        width: 360px;
        min-height: 318px;
        margin: 0;
        padding: 14px;
        overflow: hidden;
        background:
          linear-gradient(145deg, rgba(31, 39, 33, 0.97), rgba(10, 14, 12, 1))
            fixed,
          var(--bg);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -46px -138px -104px -136px;
        pointer-events: none;
        background: url("assets/80m-ascii-mark.svg") center / 560px auto
          no-repeat;
        opacity: 0.13;
        filter: contrast(1.18);
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 18% 0%,
            rgba(114, 255, 166, 0.15),
            transparent 35%
          ),
          linear-gradient(180deg, transparent 52%, rgba(5, 7, 6, 0.48));
      }

      .shell {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 12px;
      }

      header,
      .connection,
      .advanced-panel {
        border: 1px solid rgba(238, 255, 243, 0.08);
        background: var(--panel);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(14px);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 2px 7px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .mark {
        width: 94px;
        height: 66px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-left: -6px;
        flex: 0 0 auto;
      }

      .mark img {
        width: 94px;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 10px rgba(114, 255, 166, 0.24));
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 18px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.25;
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 91px;
        height: 28px;
        justify-content: center;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: #c8ffd8;
        background: rgba(15, 22, 18, 0.58);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--amber);
        box-shadow: 0 0 12px rgba(255, 217, 120, 0.3);
      }

      body[data-connection="connected"] .dot {
        background: var(--green);
        box-shadow: 0 0 14px rgba(114, 255, 166, 0.42);
      }

      body[data-connection="offline"] .dot,
      body[data-connection="error"] .dot {
        background: var(--red);
        box-shadow: 0 0 14px rgba(255, 143, 157, 0.36);
      }

      .connection {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 8px;
        border-left: 2px solid rgba(114, 255, 166, 0.28);
      }

      .connection-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 12px;
        font-weight: 900;
      }

      .connection-copy {
        min-width: 0;
      }

      .connection-copy p {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button {
        position: relative;
        isolation: isolate;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-family:
          "SFMono-Regular", Consolas, ui-monospace, monospace;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
        transition:
          transform 170ms cubic-bezier(0.2, 0.8, 0.2, 1),
          border-color 180ms ease,
          background 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      button::before,
      button::after {
        content: "";
        position: absolute;
        pointer-events: none;
        border-radius: inherit;
        opacity: 0;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
      }

      button::before {
        inset: 0;
        z-index: -1;
        background: var(--sidebar-hover);
      }

      button::after {
        inset: 5px 8px;
        z-index: -2;
        background:
          radial-gradient(
            circle at 18% 50%,
            rgba(74, 222, 128, 0.24),
            transparent 54%
          ),
          linear-gradient(90deg, rgba(74, 222, 128, 0.1), transparent);
        filter: blur(8px);
        transform: scale(0.94);
      }

      button:disabled {
        cursor: progress;
        opacity: 0.68;
      }

      button:not(:disabled):hover {
        transform: translateX(2px);
        border-color: var(--sidebar-border);
        background: var(--sidebar-hover);
        color: var(--green);
      }

      button:not(:disabled):hover::before,
      button:not(:disabled):hover::after {
        opacity: 1;
      }

      .secondary {
        width: 90px;
      }

      .primary {
        width: 100%;
        height: 44px;
        justify-content: flex-start;
        padding: 0 14px;
        border-color: rgba(114, 255, 166, 0.32);
        background: var(--sidebar-active);
        color: var(--green);
        font-size: 13px;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.22);
      }

      .primary:not(:disabled):hover {
        border-color: rgba(114, 255, 166, 0.7);
        color: #d9ffe4;
      }

      .status {
        min-height: 18px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .status.error {
        color: var(--red);
      }

      .status.success {
        color: var(--green);
      }

      details {
        border-radius: 8px;
      }

      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        list-style: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      .advanced-panel {
        display: grid;
        gap: 9px;
        margin-top: 8px;
        padding: 9px;
        border-radius: 8px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: rgba(18, 24, 21, 0.86);
        color: var(--text);
        padding: 0 9px;
        font: inherit;
        font-size: 12px;
        outline: none;
      }

      input:focus {
        border-color: var(--green);
      }

      .advanced-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
    </style>
  </head>
  <body data-connection="connecting">
    <main class="shell">
      <header>
        <div class="identity">
          <div class="mark">
            <img src="assets/80m-mark-white.svg" alt="80M" />
          </div>
          <div>
            <h1>Cortex</h1>
            <p>Knowledge Knaight</p>
          </div>
        </div>
        <div class="status-chip">
          <span class="dot"></span>
          <span id="connectionChip">Linking</span>
        </div>
      </header>

      <section class="connection" aria-live="polite">
        <div class="connection-copy">
          <div class="connection-title">
            <span class="dot"></span>
            <span id="connectionLabel">Connecting</span>
          </div>
          <p id="connectionSub">Looking for 80M Desktop</p>
        </div>
        <button id="connectButton" class="secondary" type="button">
          Connect
        </button>
      </section>

      <button id="captureButton" class="primary" type="button">
        Save to Cortex
      </button>
      <div id="status" class="status"></div>

      <details>
        <summary>Advanced</summary>
        <div class="advanced-panel">
          <label>
            Companion URL
            <input id="companionUrl" spellcheck="false" />
          </label>
          <div class="advanced-actions">
            <button id="saveEndpointButton" type="button">Save</button>
            <button id="resetConnectionButton" type="button">Reset</button>
          </div>
        </div>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
