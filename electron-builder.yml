appId: com.foleybot.desktop
productName: Foleybot
directories:
  buildResources: build
files:
  - out/**
  - resources/icon.png
  - package.json
extraResources:
  - from: docs/hermes-kanban
    to: hermes-kanban/docs
  - from: docs/medium
    to: hermes-kanban/medium
  - from: vendor/hermes-kanban
    to: hermes-kanban/vendor
  - from: extensions/cortex-clipper
    to: extensions/cortex-clipper
  - from: src/renderer/src/assets/models/winged-atm-buddy.glb
    to: mobile-assets/winged-atm-buddy.glb
  - from: src/renderer/src/assets/80m-logo.svg
    to: mobile-assets/80m-logo.svg
  - from: src/renderer/src/assets/80m-agent-wordmark.svg
    to: mobile-assets/80m-agent-wordmark.svg
  - from: extensions/cortex-clipper/assets/80m-ascii-mark.svg
    to: mobile-assets/80m-ascii-mark.svg
  - from: extensions/cortex-clipper/assets/80m-mark-white.svg
    to: mobile-assets/80m-mark-white.svg
  - from: extensions/cortex-clipper/assets/80m-mark-black.svg
    to: mobile-assets/80m-mark-black.svg
  - from: node_modules/three/build/three.module.js
    to: mobile-assets/three/build/three.module.js
  - from: node_modules/three/build/three.core.js
    to: mobile-assets/three/build/three.core.js
  - from: node_modules/three/examples/jsm/loaders/GLTFLoader.js
    to: mobile-assets/three/examples/jsm/loaders/GLTFLoader.js
  - from: node_modules/three/examples/jsm/utils/BufferGeometryUtils.js
    to: mobile-assets/three/examples/jsm/utils/BufferGeometryUtils.js
  - from: node_modules/three/examples/jsm/utils/SkeletonUtils.js
    to: mobile-assets/three/examples/jsm/utils/SkeletonUtils.js
asarUnpack:
  - resources/**
win:
  executableName: Foleybot
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: 80M
  category: Utility
  executableName: Foleybot
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: guapdad4000
  repo: 80m-agent-desktop-v3
